name: kidspark
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3

  # Persistence
  shared_preferences: ^2.1.1

  # Audio + speech
  audioplayers: ^6.5.1
  flutter_tts: ^4.0.2

  # Animations
  flutter_animate: ^4.5.2

  # UI / fonts
  google_fonts: ^6.3.3

  # Platform
  android_intent_plus: ^5.3.0

  # TTS cache infrastructure
  path_provider: ^2.1.5
  crypto: ^3.0.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon.png"
  adaptive_icon_background: "#E0F0FF"
  adaptive_icon_foreground: "assets/images/appicon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
